services:
  - type: worker
    name: english-self-study-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_FILE
        value: /data/state.json
      - key: MATERIALS_DIR
        value: /app/materials
      - key: TZ_OFFSET_MINUTES
        value: "300"
